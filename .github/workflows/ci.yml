name: Framework checks and local demo

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: local-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  local-demo:
    name: Local demo with k6 ${{ matrix.k6 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        k6: ["1.3.0", "2.3.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
        with:
          k6-version: ${{ matrix.k6 }}
      - run: npm ci --ignore-scripts
      - run: npm run doctor
      - name: Run temporary loopback API demo
        run: npm run demo
      - name: Verify failure gates, cleanup and credential isolation
        run: npm run integration
      - name: Upload aggregate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-demo-k6-${{ matrix.k6 }}
          path: |
            results/**/reports/*.xlsx
            results/**/reports/*.html
            results/**/metrics/summary.json
            results/**/checks/junit.xml
            results/**/metadata/run.json
            results/**/index.html
            results/latest.json
            results/latest-success.json
          if-no-files-found: warn
          retention-days: 7
