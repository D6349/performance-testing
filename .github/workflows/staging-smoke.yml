name: Manual staging smoke

# Configure the staging environment's required reviewers and default-branch-only
# deployment branch restriction in repository settings before running.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-api-smoke
  cancel-in-progress: false

jobs:
  staging-smoke:
    if: github.ref_name == github.event.repository.default_branch
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: "2.3.0"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Smoke test the reviewed staging target
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: npm run perf -- --env staging --api example --suite health --profile smoke
      - name: Upload aggregate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-smoke-reports
          path: |
            results/**/reports/*.xlsx
            results/**/reports/*.html
            results/**/metrics/summary.json
            results/**/checks/junit.xml
            results/**/metadata/run.json
            results/**/index.html
            results/latest.json
            results/latest-success.json
          if-no-files-found: warn
          retention-days: 7
